name: NodeJS with Webpack

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: responsively-desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Desktop webpack build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
    defaults:
      run:
        working-directory: ./desktop-app
    steps:
      - uses: actions/checkout@v4

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
          cache-dependency-path: ./desktop-app/yarn.lock

      - name: Install desktop app dependencies
        run: yarn install --network-timeout 120000

      - name: Build desktop app bundles
        run: yarn run build
